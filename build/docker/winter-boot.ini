; WinterBoot PHP runtime defaults (loaded last in conf.d, wins over
; php.ini-production — installed as the base php.ini by the Dockerfile
; — and over extension inis). Baked into signalforge/phpbase, inherited
; by every app/migrations image.
;
; Silence E_DEPRECATED / E_USER_DEPRECATED log noise: Winter Boot and
; its vendors predate PHP 8.5 (implicitly-nullable parameters,
; tentative return types on internal interfaces). Real errors still
; display. Revisit when the framework is fixed for PHP 8.5.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
;
; Pin variables_order: EnvPropertySource reads $_ENV, which is only
; populated when order includes E. php.ini-production (installed as
; the base php.ini above) ships GPCS, which would silently empty $_ENV
; and break $env.* datasource config — this override restores the E.
variables_order = EGPCS
